<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Stackly</title>
    <link rel="icon" type="image/webp" href="../images/icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/home.css?v=20261109">
    <link rel="stylesheet" href="../CSS/404.css">
</head>

<body class="error-page">
    <main class="err-main">
        <div class="err-decor" aria-hidden="true">
            <span class="err-orbit err-orbit--one"></span>
            <span class="err-orbit err-orbit--two"></span>
            <span class="err-orbit err-orbit--three"></span>
            <span class="err-glow"></span>
        </div>

        <div class="err-inner">
            <a href="../index.html" class="err-logo" aria-label="Stackly home">
                <img src="../images/logo-full-theme.webp" alt="Stackly">
            </a>

            <div class="err-center">
                <div class="err-code" aria-label="404 error">
                    <span class="err-digit">4</span>
                    <span class="err-mark"><i class="fas fa-compass"></i></span>
                    <span class="err-digit">4</span>
                </div>

                <span class="err-kicker"><i class="fas fa-location-dot"></i> OFF THE MAP</span>
                <h1 class="err-title">This page has <em>wandered.</em></h1>
                <p class="err-text">The path you are looking for is not here. Let us guide you back to somewhere beautiful.</p>
            </div>

            <div class="err-actions">
                <a href="../index.html" class="err-btn err-btn--gold">
                    <i class="fas fa-house"></i>
                    <span>Back to Home</span>
                </a>
                <button type="button" class="err-btn err-btn--ghost" id="errBack">
                    <i class="fas fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
            </div>

            <p class="err-note"><i class="fas fa-headset"></i> Our concierge is always a message away</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../JS/404.js"></script>
</body>

</html>
