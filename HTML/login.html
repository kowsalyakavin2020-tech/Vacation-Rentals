<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Stackly Vacation Rentals</title>
  <meta name="description" content="Sign in to the Stackly Vacation Rentals portal to review your stays, saved villas and carefree escapes.">
  <link rel="icon" href="../images/icon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../CSS/home.css">
  <link rel="stylesheet" href="../CSS/auth.css">
</head>
<body class="auth auth--login">

  <div class="auth__bg" aria-hidden="true">
    <img src="../images/r1.webp" alt="">
    <span class="auth__bgveil"></span>
  </div>
  <div class="auth__grid" aria-hidden="true"></div>

  <header class="auth__top shell">
    <a class="auth__brand" href="../index.html" aria-label="Stackly Vacation Rentals — home">
      <img src="../images/logo-full-theme.webp" alt="Stackly Vacation Rentals">
    </a>
    <a class="auth__back" href="../index.html">
      <i class="fa-solid fa-arrow-left"></i><span>Back to home</span>
    </a>
  </header>

  <main class="auth__stage shell">
    <section class="lg_wrap" aria-labelledby="loginTitle">
      <div class="lg_orbit" aria-hidden="true"><i></i><i></i><i></i></div>

      <aside class="lg_chip lg_chip--a" aria-hidden="true">
        <i class="fa-solid fa-shield-heart"></i>
        <div><b>Secure booking</b><span>Private &amp; encrypted</span></div>
      </aside>
      <aside class="lg_chip lg_chip--b" aria-hidden="true">
        <i class="fa-solid fa-concierge-bell"></i>
        <div><b>Concierge, 24/7</b><span>Always here for you</span></div>
      </aside>

      <article class="lg_card">
        <div class="lg_banner">
          <div class="lg_banner__img">
            <img src="../images/r1.webp" alt="A secluded coastal villa at golden hour">
          </div>
          <div class="lg_banner__veil"></div>
          <span class="lg_banner__chip"><i class="fa-solid fa-circle-check"></i> Secure guest portal</span>
          <div class="lg_banner__copy">
            <span class="lg_banner__eyebrow"><i class="fa-solid fa-suitcase-rolling"></i> Welcome back</span>
            <h1 class="lg_banner__title" id="loginTitle">Welcome <em>back</em>.</h1>
          </div>
          <div class="lg_porthole">
            <img src="../images/r28.webp" alt="Stackly villa terrace">
          </div>
        </div>

        <div class="lg_body">
          <form class="auth-form" id="loginForm" novalidate autocomplete="off">
            <div class="lg_body__grid">

              <div class="af af--full">
                <label class="af__label" for="loginEmail"><i class="fa-regular fa-envelope"></i> Email</label>
                <div class="af__wrap">
                  <input class="af__input" id="loginEmail" name="email" type="email" inputmode="email"
                         placeholder="you@example.com" autocomplete="off" value="">
                </div>
                <p class="af__err"><i class="fa-solid fa-circle-exclamation"></i><span></span></p>
              </div>

              <div class="af af--pw">
                <label class="af__label" for="loginPassword"><i class="fa-solid fa-lock"></i> Password</label>
                <div class="af__wrap">
                  <input class="af__input" id="loginPassword" name="password" type="password"
                         placeholder="At least 8 characters" autocomplete="new-password" value="">
                  <button class="af__eye" type="button" data-toggle="loginPassword" aria-label="Show password">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
                <p class="af__err"><i class="fa-solid fa-circle-exclamation"></i><span></span></p>
              </div>

              <div class="af af--sel">
                <label class="af__label" for="loginRole"><i class="fa-solid fa-id-badge"></i> Role</label>
                <div class="af__wrap">
                  <select class="af__input" id="loginRole" name="role" autocomplete="off">
                    <option value="">Select your role</option>
                    <option value="client">Client · Villa guest</option>
                    <option value="admin">Admin · Management</option>
                  </select>
                  <i class="af__caret fa-solid fa-chevron-down" aria-hidden="true"></i>
                </div>
                <p class="af__err"><i class="fa-solid fa-circle-exclamation"></i><span></span></p>
              </div>

              <div class="auth-form__row af--full">
                <label class="acheck">
                  <input type="checkbox" id="rememberMail" name="remember">
                  <span class="acheck__box"><i class="fa-solid fa-check"></i></span>
                  <span>Remember my email</span>
                </label>
                <a class="auth-form__link" id="forgotLink" href="404.html">Forgot password?</a>
              </div>

              <button class="auth-form__submit af--full" id="loginSubmit" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign in
              </button>

              <div class="auth-form__sep af--full">or</div>

              <button class="auth-google af--full" id="loginGoogle" type="button">
                <i class="fa-brands fa-google"></i> Continue with Google
              </button>

              <p class="auth-form__note af--full" id="loginNote" role="status" aria-live="polite"></p>

              <p class="auth-form__alt af--full">New to Stackly? <a href="signup.html">Create an account</a></p>
            </div>
          </form>
        </div>
      </article>
    </section>
  </main>

  <script src="../JS/auth.js"></script>
</body>
</html>
